<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ crate::shared::assets::css_href() }}">
  <script defer src="{{ crate::shared::assets::js_href() }}"></script>
  <title>{% block title %}University of Belize{% endblock %}</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header>
    <nav aria-label="Primary">
      <a href="/ui/catalog">Catalog</a>
      <a href="/ui/registration">Registration</a>
      <a href="/ui/grades">Grades</a>
      <a href="/ui/history">History</a>
      <a href="/ui/documents">Documents</a>
    </nav>
  </header>

  <main id="main">
      {% block content %}{% endblock %}
  </main>
</body>
</html>
