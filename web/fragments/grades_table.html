<section id="grades-table">
  <table>
    <thead>
      <tr>
        <th scope="col">Course</th>
        <th scope="col">Section</th>
        <th scope="col">Grade</th>
      </tr>
    </thead>
    <tbody>
      {% for grade in grades %}
      <tr>
        <td>{{ grade.course_code }} — {{ grade.course_title }}</td>
        <td>{{ grade.section_code }}</td>
        <td>{{ grade.grade_code }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
