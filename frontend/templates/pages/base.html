<!doctype html>
<html lang="en"{{ crate::shared::theme::html_attr() }}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ crate::shared::assets::css_href() }}">
  <script defer src="{{ crate::shared::assets::js_href() }}"></script>
  <title>{% block title %}University of Belize{% endblock %}</title>
</head>
{% import "components/ui.html" as ui %}
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell {% block shell_class %}{% endblock %}{{ crate::shared::theme::rail_class() }}">
    {% block rail %}
    {% call ui::primary_nav("") %}{% endcall %}
    {% endblock %}

    <main id="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
