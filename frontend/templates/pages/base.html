<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ crate::shared::assets::css_href() }}">
  <script defer src="{{ crate::shared::assets::js_href() }}"></script>
  <title>{% block title %}University of Belize{% endblock %}</title>
</head>
{% import "components/ui.html" as ui %}
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell {% block shell_class %}{% endblock %}">
    {% block rail %}
    <header class="topbar">
      <span class="brand">University of Belize</span>
      <details class="nav-sheet">
        <summary>Menu</summary>
        <nav class="sheet-panel" aria-label="Primary">
          {% call ui::nav_links() %}{% endcall %}
        </nav>
      </details>
    </header>
    <nav class="rail" aria-label="Primary">
      <span class="brand">University of Belize</span>
      {% call ui::nav_links() %}{% endcall %}
      <div class="rail-foot">
        <a href="/ui/signout">Sign out</a>
      </div>
    </nav>
    {% endblock %}

    <main id="main">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
