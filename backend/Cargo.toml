[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# actix-http is already in actix-web's tree; the direct dependency exists only
# for h1::Payload, which the CSRF middleware uses to re-inject buffered bodies.
actix-http = "3"
actix-web = "4"
askama = "0.16"
arc-swap = "1"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
ed25519-dalek = { version = "2", features = ["serde"] }
hex = "0.4"
printpdf = "0.10"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
