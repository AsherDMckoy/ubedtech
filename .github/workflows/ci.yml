name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Test database for #[sqlx::test]; each test creates its own throwaway
  # database from this connection, so one service instance is enough.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ubedtech_test

jobs:
  # Dependency advisories + license policy (deny.toml). Fails the build on
  # a known vulnerability, a yanked crate, or a license outside the
  # allowlist.
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
          manifest-path: backend/Cargo.toml

  quality-gates:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ubedtech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # The four quality gates from CLAUDE.md section 6, in order. A red gate
      # fails the build; there is no allow-failure anywhere.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets --all-features

      - name: cargo build (release profile compiles)
        run: cargo build --release

      # Frontend: committed dist/ must match the sources (ADR-12), and the
      # axe harness must pass on the rendered critical pages.
      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: frontend assets build reproducibly to the committed dist/
        working-directory: frontend
        run: |
          npm ci
          npm run build
          git diff --exit-code -- dist

      - name: frontend accessibility harness (axe)
        working-directory: frontend
        run: npm test
